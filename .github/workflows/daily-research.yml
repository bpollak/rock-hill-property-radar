name: Daily property research

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-property-research
  cancel-in-progress: false

jobs:
  research-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAMILY_ANCHOR_ADDRESS: ${{ secrets.FAMILY_ANCHOR_ADDRESS }}
      OPENAI_RESEARCH_MODEL: gpt-5.6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Research actual properties
        run: npm run research
      - name: Validate and build
        run: npm run check
      - name: Preserve successful snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "data: daily property research $(date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy validated research
        id: deployment
        uses: actions/deploy-pages@v4
